<!doctype html><meta charset="utf-8"><title>AulaScout - Demo Jueces</title>
<style>body{font-family:system-ui;max-width:900px;margin:20px auto;padding:20px} .drop{border:2px dashed #888;padding:20px;text-align:center} img{max-width:100%} pre{background:#f5f5f5;padding:10px;overflow:auto}</style>
<h1>AulaScout - Demo Jueces</h1>
<p>Sube foto del salón (sin personas) + audio 5-7s. Pipeline real: Voice WAV mayúscula 200 OK, SAM EN mat 1/1, Spark 3500 stop 3 acts Seguridad x3, Image 3 paneles.</p>
<div class="drop"><input type="file" id="foto" accept="image/*"> Foto<br><br><input type="file" id="audio" accept="audio/*"> Audio m4a/wav<br><br><button onclick="generar()">Generar planeación</button></div>
<div id="out"></div>
<script>
async function generar(){
 let fd=new FormData(); fd.append('foto', document.getElementById('foto').files[0]); fd.append('audio', document.getElementById('audio').files[0]);
 let r=await fetch('/api/generar',{method:'POST',body:fd}); let j=await r.json();
 document.getElementById('out').innerHTML=`<h3>Transcripción</h3><pre>${j.transcripcion}</pre><h3>Run</h3><pre>${JSON.stringify(j,null,2)}</pre><h3>Ficha cache</h3><img src="/out/ficha.png"><br><video controls src="/out/demo_aulascout.mp4" width="100%"></video>`;
}
</script>
