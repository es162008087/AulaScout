<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AulaScout - Demo Jueces</title>
<style>
body{font-family:system-ui;max-width:900px;margin:20px auto;padding:20px}
.drop{border:2px dashed #888;padding:20px;text-align:center}
img{max-width:100%} pre{background:#f5f5f5;padding:10px;overflow:auto;white-space:pre-wrap}
button:disabled{opacity:.5}
.spin{display:none;margin-top:14px} .spin.on{display:block}
.spin i{display:inline-block;width:18px;height:18px;border:3px solid #ccc;border-top-color:#333;border-radius:50%;animation:r 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#b00020;font-weight:600}
</style>
<h1>AulaScout - Demo Jueces</h1>
<p>Sube foto del salón (sin personas) + audio 15-20s. Pipeline real: Voice + SAM + Spark + Image.</p>
<div class="drop"><input type="file" id="foto" accept="image/*"> Foto<br><br><input type="file" id="audio" accept=".m4a,.wav,.mp3,audio/*"> Audio m4a/wav<br><br><button id="btn" onclick="generar()">Generar planeación</button>
<div class="spin" id="spin"><i></i>Generando, tarda ~2 minutos, pipeline real</div></div>
<div id="out"></div>
<script>
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
async function generar(){
 const out=document.getElementById('out'),btn=document.getElementById('btn'),spin=document.getElementById('spin');
 const f=document.getElementById('foto').files[0],a=document.getElementById('audio').files[0];
 out.replaceChildren();
 if(!f||!a){out.append(el('p','Elige foto y audio','err'));return}
 btn.disabled=true;spin.classList.add('on');
 try{
  const fd=new FormData();fd.append('foto',f);fd.append('audio',a);
  const r=await fetch('/api/generar',{method:'POST',body:fd});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok&&!j.transcripcion){out.append(el('p',j.error||('Error '+r.status),'err'));return}
  if(!j.ok)out.append(el('p','El pipeline terminó con fallos (ver estados)','err'));
  out.append(el('h3','Transcripción'),el('pre',j.transcripcion));
  out.append(el('h3','Run'),el('pre',JSON.stringify({latencia_s:j.latencia_s,llamadas:j.llamadas,estados:j.estados},null,2)));
  out.append(el('h3','Planeación'),el('pre',j.planeacion));
  if(j.archivos&&j.archivos['ficha.png']){out.append(el('h3','Ficha'));const im=el('img');im.src=j.archivos['ficha.png'];out.append(im)}
 }catch(e){out.append(el('p','Error de red: '+e.message,'err'))}
 finally{btn.disabled=false;spin.classList.remove('on')}
}
</script></html>
